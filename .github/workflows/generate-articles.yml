name: Generate static article pages

on:
  schedule:
    # Every 30 minutes — picks up newly published/edited articles from Supabase.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/generate-articles.mjs'
      - 'package.json'
      - '.github/workflows/generate-articles.yml'

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate article pages, index, and sitemap
        id: generate
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: npm run generate:articles > /tmp/gen-output.log 2>&1; echo "exit_code=$?" >> "$GITHUB_OUTPUT"; cat /tmp/gen-output.log

      - name: Report failure as an issue
        if: steps.generate.outputs.exit_code != '0'
        run: |
          BODY=$(tail -c 60000 /tmp/gen-output.log)
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "$(jq -n --arg body "$BODY" '{title: "generate-articles failed", body: $body, labels: ["automation-failure"]}')"

      - name: Fail job if generation failed
        if: steps.generate.outputs.exit_code != '0'
        run: exit 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No article changes to commit."
          else
            git commit -m "chore: regenerate static article pages [automated]"
            git push
          fi
